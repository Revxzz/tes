<html lang="en">
<head>

    <title>Auto Pinger</title>

            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            font-size: 16px;

        }
        
        .button-group {
            text-align: center;

        .button-group button {
            width: 100px;
            height: 40px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .button-group button:hover {

        }
        
        .status {

    </style>
</head>
